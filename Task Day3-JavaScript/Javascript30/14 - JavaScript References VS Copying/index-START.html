<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Reference VS Copy</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>

  <script>
    // start with strings, numbers and booleans
    let age =100;

    let age2=age;

    // with Objects
    const person = {
      name: 'Wes Bos',
      age: 80
    };



    // and think we make a copy:

    const p2=person;
    p2.name=""
    console.log(JSON.stringify(person,null,2));
    p2.number=10;
    console.log(JSON.stringify(p2,null,2));
    // how do we take a copy instead?

   const cap2 = Object.assign({},person,{number: 99});
   console.log(JSON.stringify(cap2,null,2))

    // We will hopefully soon see the object ...spread

    // const cap3= {...person};



    // Things to note - this is only 1 level deep - both for Arrays and Objects. lodash has a cloneDeep method, but you should think twice before using it.
  const wes ={
    name: 'wes',
    age :100,
    social:{
      twiter:'@sonjoy'
     , facebook: '@sonjoyf'
    }
  }

  console.log(wes);
  const dev= Object.assign({},wes);
  dev.social.twiter='@male';

  console.log(JSON.stringify (wes,null,2));
  console.log(JSON.stringify (dev,null,2));
  // when to go 2 level clone deep 

  //cheating way 
  const deev2= JSON.parse(JSON.stringify(wes));
  //stringify makes the wes a string but JSON.parse make it an object again
  deev2.social.twiter='@hibijibi';


  </script>

</body>
</html>
