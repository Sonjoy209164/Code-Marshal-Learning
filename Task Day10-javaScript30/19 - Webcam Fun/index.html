<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouCam Perfect Lite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="photobooth">
    <div class="controls">
      <h2>YouCam Perfect 🎥</h2>

      <div class="sliders">
        <label>Brightness <input type="range" id="brightness" min="0" max="2" step="0.1" value="1"></label>
        <label>Contrast <input type="range" id="contrast" min="0" max="2" step="0.1" value="1"></label>
        <label>Smoothness <input type="range" id="smooth" min="0" max="10" step="1" value="0"></label>
      </div>

      <div class="filters">
        <button data-filter="normal" class="active">Normal</button>
        <button data-filter="grayscale">Grayscale</button>
        <button data-filter="sepia">Sepia</button>
        <button data-filter="cool">Cool</button>
        <button data-filter="warm">Warm</button>
        <button data-filter="vivid">Vivid</button>
      </div>

      <div class="sticker-control">
        <label>Add Sticker: </label>
        <select id="stickerSelect">
          <option value="">None</option>
          <option value="😎">😎 Sunglasses</option>
          <option value="💋">💋 Lips</option>
          <option value="🌸">🌸 Flower</option>
          <option value="🐱">🐱 Cat</option>
        </select>
      </div>

      <button class="capture-btn" onClick="takePhoto()">📸 Capture</button>
    </div>

    <video class="player" autoplay></video>
    <canvas class="photo"></canvas>
    <div class="strip"></div>
  </div>

  <audio class="snap" src="./snap.mp3" hidden></audio>
  <script src="scripts.js"></script>
</body>
</html>
